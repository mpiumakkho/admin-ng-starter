<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Admin Dashboard</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="theme-light">
  <!-- The theme and the rest of the first paint (public/theme.js); a file, not inline, for the CSP -->
  <script src="theme.js"></script>
  <app-root>
      <div class="boot-frame" aria-hidden="true">
        <div class="boot-navbar"><span class="boot-block boot-logo"></span><span class="boot-block boot-search"></span><span class="boot-block boot-avatar"></span></div>
        <div class="boot-sidebar"><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span></div>
        <div class="boot-main">
          <span class="boot-block boot-title"></span>
          <span class="boot-block boot-subtitle"></span>
          <div class="boot-card"><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span></div>
        </div>
      </div>
      <div class="main-spinner-wrapper">
        <div class="donut"></div>
      </div>
  </app-root>
</body>
</html>
