@if (!isFullPage()) {
  <app-navbar />
}
<div class="app-body" [class.full-page]="isFullPage()">
  @if (!isFullPage()) {
    <app-sidebar />
  }
  <div class="main-panel">
    <main class="content-wrapper">
      <!-- The accessible view keeps messages until dismissed, so they sit above the page instead of covering it -->
      @if (accessibleView.on()) {
        <ui-toaster inline [dismissLabel]="'Dismiss' | translate" />
      }
      @if (!isFullPage()) {
        <app-session-notices />
      }
      <!-- The spinner covers the page while the next one loads. The page stays, so it can still ask about unsaved changes. -->
      @if (isLoading()) {
        <app-spinner />
      }
      <div contentAnimate class="page">
        <router-outlet />
      </div>
    </main>
    @if (!isFullPage()) {
      <app-footer />
    }
  </div>
</div>
<!-- On the pages without the navbar, the switch to the accessible view; signed in, it is in the account menu -->
@if (isFullPage()) {
  <app-accessible-view-switch />
}
@if (!accessibleView.on()) {
  <ui-toaster [dismissLabel]="'Dismiss' | translate" />
}
<app-reauth-dialog />
