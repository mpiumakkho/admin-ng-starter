@if (!isFullPage()) {
  <app-navbar />
}
<div class="app-body" [class.full-page]="isFullPage()">
  @if (!isFullPage()) {
    <app-sidebar />
  }
  <div class="main-panel">
    <main class="content-wrapper">
      <!-- The spinner covers the page while the next one loads. The page stays, so it can still ask about unsaved changes. -->
      @if (isLoading()) {
        <app-spinner />
      }
      <div contentAnimate class="page">
        <router-outlet />
      </div>
    </main>
    @if (!isFullPage()) {
      <app-footer />
    }
  </div>
</div>
<ui-toaster />
