# The production build behind nginx, with the protections browsers need from the page (OWASP ASVS V3.4;
# ../admin-api-starter/docs/02-DECISIONS.md P-038). Copy dist/admin-dashboard/browser/ to /usr/share/nginx/html and this file to
# /etc/nginx/conf.d/default.conf. TLS ends here or at a load balancer in front: browsers reach the app over HTTPS only.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Scripts only from the app's own files: no inline script (public/theme.js picks the theme before the first paint).
    # Styles may be inline: Angular puts component styles in <style> elements, and the print view writes its own.
    # Pictures may be data: URLs (profile pictures). The API is on this origin, at /api; add its origin to connect-src
    # if it is served elsewhere.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # For browsers too old for frame-ancestors: never in a frame of another site
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # The links in emails carry a token in the address: it is sent nowhere else
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # The API (../admin-api-starter), here under the host name api; it sends its own headers too
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Written over, never added to, so nobody can pass for another address (the API trusts only this proxy)
        proxy_set_header X-Forwarded-For $remote_addr;
        # https when TLS ends here; set it to https yourself when it ends at a load balancer in front
        proxy_set_header X-Forwarded-Proto $scheme;
        # The live updates (GET /api/events) stream for as long as the page is open
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Files with a hash in their name never change: cached for a year
    location ~* "-[A-Za-z0-9_-]{8}\.(?:js|css|woff2|svg|png|jpg)$" {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else, index.html and theme.js among them, is checked again on every load; any other path is a page
    # of the app
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
